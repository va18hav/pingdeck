services:
  db:
    image: postgres:17-alpine
    container_name: pingdeck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pingdeck
      POSTGRES_PASSWORD: pingdeck_password
      POSTGRES_DB: pingdeck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingdeck -d pingdeck"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: