services:
  db:
    image: postgres:17-alpine
    container_name: pingdeck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pingdeck
      POSTGRES_PASSWORD: pingdeck_password
      POSTGRES_DB: pingdeck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingdeck -d pingdeck"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pingdeck-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Hostname "db" resolves to the Postgres service inside the compose network.
      DATABASE_URL: postgres://pingdeck:pingdeck_password@db:5432/pingdeck?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  postgres_data: